apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      # spread replicas across nodes, best-effort (not hard requirement, so
      # a single-node resource crunch doesn't leave a pod stuck Pending)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: pihole
                topologyKey: kubernetes.io/hostname
      initContainers:
        # each replica is stateless (emptyDir) - seed adlists.list from the
        # configmap so gravity has a source list to build from on first boot
        - name: seed-adlists
          image: busybox:1.36
          command: ["sh", "-c", "cp /config/adlists.list /etc/pihole/adlists.list"]
          volumeMounts:
            - name: lists
              mountPath: /config
            - name: etc-pihole
              mountPath: /etc/pihole
      containers:
        - name: pihole
          image: pihole/pihole:latest
          env:
            - name: TZ
              value: "Asia/Kuala_Lumpur"
            - name: FTLCONF_dns_listeningMode
              value: "ALL"
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-secret
                  key: password
          ports:
            - containerPort: 53
              protocol: TCP
              name: dns-tcp
            - containerPort: 53
              protocol: UDP
              name: dns-udp
            - containerPort: 80
              name: http
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          resources:
            requests:
              memory: "200Mi"
              cpu: "100m"
            limits:
              memory: "500Mi"
              cpu: "500m"
          volumeMounts:
            - name: etc-pihole
              mountPath: /etc/pihole
            - name: etc-dnsmasq
              mountPath: /etc/dnsmasq.d
      volumes:
        - name: lists
          configMap:
            name: pihole-lists
        - name: etc-pihole
          emptyDir: {}
        - name: etc-dnsmasq
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: pihole
  annotations:
    # pihole v6 web UI sessions are per-pod (no shared store across the 2
    # stateless replicas). Traefik's kubernetes ingress provider talks
    # directly to pod endpoints and ignores Service sessionAffinity, so
    # stickiness has to be set here instead - otherwise login on pod A gets
    # lost when the next request round-robins to pod B, bouncing to /login
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
spec:
  type: ClusterIP
  # belt-and-suspenders for any traffic that hits the ClusterIP directly
  # (bypassing traefik, e.g. from in-cluster clients)
  sessionAffinity: ClientIP
  selector:
    app: pihole
  ports:
    - port: 80
      targetPort: http
