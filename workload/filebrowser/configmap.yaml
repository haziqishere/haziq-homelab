apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser-config
  namespace: common
data:
  # FileBrowser Quantum config - https://filebrowserquantum.com/en/docs/configuration/
  # Admin password is NOT set here: on first start Quantum generates one,
  # prints it once in the pod log, and forces a change on first login.
  config.yaml: |
    http:
      port: 80
      baseURL: "/"
      externalUrl: "https://filebrowser.haziqhakimi.online"
    server:
      cacheDir: "/home/filebrowser/tmp"
      database:
        path: "/home/filebrowser/data/database.sqlite"
      logging:
        - levels: "info|error|warning"
      sources:
        - path: "/srv"
          name: "NAS"
          config:
            defaultEnabled: true
    auth:
      methods:
        password:
          enabled: true
          minLength: 8
          signup: false
