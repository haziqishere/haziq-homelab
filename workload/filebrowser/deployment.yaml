# FileBrowser Quantum (gtsteffaniak/filebrowser) - Drive-like UI over the NAS.
# Runs as uid 1000 like the old filebrowser, so NAS file permissions are unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: common
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
      annotations:
        # bump to force a rollout after editing configmap.yaml
        filebrowser.io/config-rev: "1"
    spec:
      nodeSelector:
        kubernetes.io/hostname: raspberrypi
      containers:
        - name: filebrowser
          image: gtstef/filebrowser:2.1.0-stable
          env:
            - name: FILEBROWSER_CONFIG
              value: /config/config.yaml
            - name: TZ
              value: Asia/Kuala_Lumpur
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          volumeMounts:
            - name: nas
              mountPath: /srv
            - name: data
              mountPath: /home/filebrowser/data # sqlite db
            - name: config
              mountPath: /config
              readOnly: true
            - name: cache
              mountPath: /home/filebrowser/tmp # thumbnails/previews, must be local disk
      volumes:
        - name: nas
          persistentVolumeClaim:
            claimName: filebrowser-nas
        - name: data
          persistentVolumeClaim:
            claimName: filebrowser-data
        - name: config
          configMap:
            name: filebrowser-config
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser
  namespace: common
spec:
  selector:
    app: filebrowser
  ports:
    - port: 80
      targetPort: http
