# This is a Kubernetes manifest file for deploying Immich's PostgreSQL database. It includes a Secret for database credentials, a PersistentVolumeClaim for data storage, a Deployment for the PostgreSQL container, and a Service to expose the database.

apiVersion: v1
kind: Secret
metadata:
  name: immich-postgres-secret
  namespace: immich
type: Opaque
stringData:
  POSTGRES_DB: immich
  POSTGRES_USER: immich
  POSTGRES_PASSWORD: immich
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-pvc
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: haziq-homelab
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:16-vectorchord0.3.0-pgvectors0.2.0
          envFrom:
            - secretRef:
                name: immich-postgres-secret
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
spec:
  selector:
    app: immich-postgres
  ports:
    - port: 5432
      targetPort: 5432
