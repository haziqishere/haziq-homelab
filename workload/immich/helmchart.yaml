apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: immich
  namespace: kube-system
spec:
  repo: https://immich-app.github.io/immich-charts
  chart: immich
  targetNamespace: immich
  valuesContent: |-
    immich:
      persistence:
        library:
          existingClaim: immich-library-pvc
    server:
      nodeSelector:
        kubernetes.io/hostname: haziq-homelab
      extraEnv:
        - name: DB_HOSTNAME
          value: immich-postgres.immich.svc.cluster.local
        - name: DB_PORT
          value: "5432"
        - name: DB_USERNAME
          value: immich
        - name: DB_PASSWORD
          value: immich
        - name: DB_DATABASE_NAME
          value: immich
        - name: REDIS_HOSTNAME
          value: immich-redis.immich.svc.cluster.local
        - name: REDIS_PORT
          value: "6379"
      extraVolumes:
        - name: media
          persistentVolumeClaim:
            claimName: immich-media-pvc
      extraVolumeMounts:
        - name: media
          mountPath: /mnt/media
          readOnly: true

    machine-learning:
      enabled: true
      nodeSelector:
        kubernetes.io/hostname: haziq-homelab
      runtimeClassName: nvidia
      resources:
        limits:
          nvidia.com/gpu: 1
      persistence:
        cache:
          storageClass: local-path
          size: 10Gi

