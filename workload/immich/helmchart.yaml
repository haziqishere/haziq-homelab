apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: immich
  namespace: kube-system
spec:
  repo: https://immich-app.github.io/immich-charts
  chart: immich
  targetNamespace: immich
  valuesContent: |-
    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME: immich-postgres.immich.svc.cluster.local
              DB_PORT: "5432"
              DB_USERNAME: immich
              DB_PASSWORD: immich
              DB_DATABASE_NAME: immich

    immich:
      persistence:
        library:
          existingClaim: immich-library-pvc

    valkey:
      enabled: true
      persistence:
        data:
          type: emptyDir

    server:
      controllers:
        main:
          containers:
            main:
              extraVolumes:
                - name: media
                  persistentVolumeClaim:
                    claimName: immich-media-pvc
              extraVolumeMounts:
                - name: media
                  mountPath: /mnt/media
                  readOnly: true
      nodeSelector:
        kubernetes.io/hostname: haziq-homelab

    machine-learning:
      enabled: true
      nodeSelector:
        kubernetes.io/hostname: haziq-homelab
      runtimeClassName: nvidia
      resources:
        limits:
          nvidia.com/gpu: 1
      persistence:
        cache:
          storageClass: local-path
          size: 10Gi
