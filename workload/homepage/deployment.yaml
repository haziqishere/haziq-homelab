# gethomepage.dev - public landing page at www.haziqhakimi.online.
# All config lives in configmap.yaml (GitOps); bump config-rev to roll out edits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
      annotations:
        # bump to force a rollout after editing configmap.yaml
        homepage.io/config-rev: "2"
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true # kubernetes widget reads node metrics
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.8.0
          ports:
            - containerPort: 3000
              name: http
          env:
            # required since v1.0 - requests with any other Host header are rejected
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "www.haziqhakimi.online,haziqhakimi.online"
          # HOMEPAGE_VAR_* keys, referenced in configmap as {{HOMEPAGE_VAR_X}}.
          # Created manually (not in git) - see README secrets table.
          envFrom:
            - secretRef:
                name: homepage-secrets
                optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: config
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml
            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: logs
              mountPath: /app/config/logs
      volumes:
        - name: config
          configMap:
            name: homepage-config
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  selector:
    app: homepage
  ports:
    - port: 3000
      targetPort: http
