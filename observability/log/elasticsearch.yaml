apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: elasticsearch
  namespace: kube-system
spec:
  repo: https://helm.elastic.co
  chart: elasticsearch
  targetNamespace: efk
  valuesContent: |-
    replicas: 1
    minimumMasterNodes: 1
    antiAffinity: soft
    nodeSelector:
      kubernetes.io/hostname: raspberrypi
    esJavaOpts: "-Xms256m -Xmx256m"
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 512Mi
    persistence:
      enabled: false
    esConfig:
      elasticsearch.yml: |
        xpack.security.enabled: false
        xpack.security.transport.ssl.enabled: false
