apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: elasticsearch
  namespace: kube-system
spec:
  repo: https://helm.elastic.co
  chart: elasticsearch
  targetNamespace: efk
  valuesContent: |-
    protocol: http
    createCert: false
    replicas: 1
    minimumMasterNodes: 1
    antiAffinity: soft
    nodeSelector:
      kubernetes.io/hostname: haziq-homelab
    esJavaOpts: "-Xms256m -Xmx256m"
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 1Gi
    persistence:
      enabled: false
    esConfig:
      elasticsearch.yml: |
        xpack.security.enabled: false
        xpack.security.transport.ssl.enabled: false
