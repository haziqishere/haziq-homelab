apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: fluent-bit
  namespace: kube-system
spec:
  repo: https://fluent.github.io/helm-charts
  chart: fluent-bit
  targetNamespace: efk
  valuesContent: |-
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 2
    tolerations:
      - operator: Exists
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - raspberrypi
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 256Mi
    config:
      inputs: |-
        [INPUT]
            Name tail
            Path /var/log/containers/*.log
            multiline.parser docker, cri
            Tag kube.*
            Mem_Buf_Limit 50MB
            Skip_Long_Lines On

        [INPUT]
            Name systemd
            Tag host.*
            Systemd_Filter _SYSTEMD_UNIT=kubelet.service
            Read_From_Tail On
      outputs: |-
        [OUTPUT]
            Name            es
            Match           kube.*
            Host            elasticsearch-master
            Port            9200
            Logstash_Format On
            Logstash_Prefix fluent-bit
            Retry_Limit     False
            Suppress_Type_Name On
