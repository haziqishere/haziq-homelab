apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - postgresql.yaml
  - redis.yaml
  - server-deployment.yaml
  - worker-deployment.yaml
  - ingress.yaml

# PAUSED 2026-11-27 (homelab thermal throttling): HPA can't scale to 0, so drop
# it while background-services is at 0 replicas. Remove this block to restore.
patches:
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: prefect-server-background-services
        namespace: prefect
