apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube2iam
  namespace: kube-system
spec:
  selector:
    matchLabels: { app: kube2iam }
  template:
    metadata:
      labels: { app: kube2iam }
    spec:
      nodeSelector:
        # NOTE: This is a hardcoded node selector.
        # other node like raspberrypi has disk pressure and keep restarting.
        # since all k8s job only runs on haziq-homelab for now, we set affinity to only
        # run on haziq-homelab
        kubernetes.io/hostname: haziq-homelab
      serviceAccountName: kube2iam
      hostNetwork: true
      containers:
        - name: kube2iam
          image: jessestuart/kube2iam:0.10.8
          args:
            - "--host-ip=$(HOST_IP)"
            - "--node=$(NODE_NAME)"
            - "--iptables=true"
            - "--namespace-restrictions=true"
            - "--base-role-arn=arn:aws:iam::658061044018:role/"
          env:
            - name: HOST_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          envFrom:
            - secretRef: { name: kube2iam-aws-credentials }
          securityContext: 
            privileged: true
          ports:
            - containerPort: 8181
              hostPort: 8181
      tolerations:
        - operator: Exists